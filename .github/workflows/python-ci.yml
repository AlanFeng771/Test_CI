# .github/workflows/python-ci.yml
name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'                       # 缓存 pip 依赖

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest          # 安装代码检查和测试工具

      - name: 运行代码格式检查（flake8）
        run: |
          # 检查语法错误和未定义变量（E9, F63, F7, F82 系列），发现问题直接报错退出
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # 检查代码风格（最大行长度 120），只统计问题数量，不报错退出
          flake8 . --count --max-line-length=120 --statistics

      - name: 运行测试
        run: pytest tests/ -v                # -v 输出详细测试结果

  secret-scan:
    name: 机敏资讯扫描（gitleaks）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # 拉取完整 git 历史，才能扫描过去 commit 中的机敏资讯

      - name: 执行 gitleaks 扫描
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --verbose --redact